apiVersion: v1
kind: Service
metadata:
  name: {{ include "digital-ticketing.fullname" . }}
  namespace: {{ include "digital-ticketing.namespace" . }}
  labels:
    {{- include "digital-ticketing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "digital-ticketing.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
